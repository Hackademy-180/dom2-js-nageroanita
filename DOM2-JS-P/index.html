<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork DOM 2 </title>
    

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<header>

<div class="container">
    <div class="row">
        <div class="col-12">

            <h1>Buongiorno bell'Anima..</h1>
        </div>
    </div>
</div>

</header>    

<main>

     <section>

        <div class="container">
            <div class="row">
                <div class="col-12">

                    <!-- FORM TEXT AREA -->
                    <form class="text_area">

<label for="text" class="metticiUnMessaggio">

<!-- INPUT TITOLO -->
                        <input type="text" class="txt-input" 
                        placeholder="Inserire titolo">

<!-- CONTENITORE MESSAGGIO -->
                        <textarea name="text-area" id="contenitore_1" class="mess"
                        
                        placeholder="Scrivi QUI.."></textarea>
                   
                </label>
                    </form>


<div class="bottone d-flex align-items-center justify-content-center">

    <button class="add_Press"> Aggiungi da qui: [+]</button>
</div>


                </div>
            </div>
        </div>
     </section>






<section class="sezione_Articoli">
    <div class="container">
        <div class="row">
            <div class="col-12">

                <article class="scatola_Articolo">

                </article>

                <div class="col-12">
                    <article class="scatola_Articolo">
                    </article>
                    . . .
                </div>
            </div>
        </div>
    </div>
</section>




</main>

<!-- Selfwork DOM 2

Crea un file html con le seguenti caratteristiche:
un input per il titolo
una textarea per inserire un paragrafo
un bottone per creare l’articolo

Al click sul bottone, crea un articolo popolato dai valori prelevati dai due input

EXTRA:
fai in modo che, cliccando sul bottone crea articolo, se titolo o paragrafo sono vuoti, esca un alert che informi
l’utente del problema
fai in modo che, una volta creato l’articolo, gli input vengano puliti

 -->

<script src="./main.js"></script>

</body>
</html>
